name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned in .bun-version. `latest` used to be here, which meant a Bun
          # release could turn CI red on a commit that changed nothing.
          bun-version-file: .bun-version

      # One lockfile for the whole repo: the root package.json is a Bun
      # workspace over backend/ and frontend/, so this installs both.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: backend
        run: bun run typecheck

      - name: Lint
        working-directory: backend
        run: bun run lint

      # `bun run test`, not `bun test src/tests`: the package script carries
      # `--parallel`, and CI should run the command developers run rather than a
      # second spelling of it that can drift.
      - name: Unit tests
        working-directory: backend
        run: bun run test

      # Builds a database from the committed Drizzle migrations alone and
      # asserts the result is what src/db/schema.ts says. A column added to
      # schema.ts with no migration fails here rather than on somebody's fresh
      # install.
      - name: Schema drift check (schema.ts vs migrations)
        working-directory: backend
        run: bun run migration-check

  # The React app. Its suite runs on `bun test` (happy-dom registered by
  # src/test/setup.ts), same runner as the backend, so there is no second test
  # toolchain to keep alive.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned in .bun-version. `latest` used to be here, which meant a Bun
          # release could turn CI red on a commit that changed nothing.
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck

      - name: Lint
        working-directory: frontend
        run: bun run lint

      - name: Unit tests
        working-directory: frontend
        run: bun run test
