name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check backend/

      # The SDK suite is run as part of `-m unit`, not as a separate excluded
      # job. It was excluded from the default suite for memory reasons, had no
      # CI job of its own, and rotted: by the time anyone ran it, three tests
      # hung forever and four more failed against a since-changed API. Keeping
      # it in the one required job is what stops that recurring.
      - name: Unit tests (including SDK)
        run: uv run poe test-unit-all

      - name: Integration tests
        run: uv run poe test-integration

      # Catches the drift that used to be silent: a column added to models.py
      # with no matching revision. Builds a database from the revisions, then
      # asks Alembic whether autogenerate would still have anything to say.
      - name: Schema drift check (models.py vs migrations)
        run: uv run poe migration-check
