name: Build and Release Windows Executable

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install backend dependencies
        run: uv sync

      # Root Bun workspace: installs frontend and backend-ts together.
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate application icon
        run: uv run python backend/scripts/generate_icon.py

      - name: Build frontend
        run: bun run build

      - name: Build Windows executable
        run: uv run pyinstaller ClaudeWorld.spec --noconfirm

      - name: Create release archive
        run: |
          cd dist
          7z a ClaudeWorld-Windows.zip ClaudeWorld.exe
        shell: bash

      # install.ps1 grabs the bare .exe; install.sh and install.ps1 must be
      # release assets so the /releases/latest/download/ one-liners resolve.
      - name: Upload to release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'release'
        with:
          files: |
            dist/ClaudeWorld.exe
            dist/ClaudeWorld-Windows.zip
            scripts/install/install.sh
            scripts/install/install.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: ClaudeWorld-Windows
          path: |
            dist/ClaudeWorld.exe
            scripts/install/install.sh
            scripts/install/install.ps1
          retention-days: 7
