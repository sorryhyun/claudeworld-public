name: Attach install scripts to release

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

# There is no Windows executable any more.
#
# `ClaudeWorld.exe` was built by PyInstaller from the FastAPI backend, which was
# deleted when the TypeScript backend became the only one. Its replacement is
# `bun build --compile`, and the open question is the native window: PyInstaller
# shipped pywebview, and Bun has no equivalent -- so a compiled binary would
# either open the system browser or need a separate shell (Tauri, Wails, an
# Electron stub). Until that is decided this workflow only attaches the install
# scripts, and `scripts/install/install.ps1` -- which downloads the exe from the
# latest release that has one -- is stale for releases cut after the purge.
#
# The macOS/Linux source install (`scripts/install/install.sh`) is unaffected.
jobs:
  attach-installers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # install.sh and install.ps1 must be release assets so the
      # /releases/latest/download/ one-liners resolve.
      - name: Upload to release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'release'
        with:
          files: |
            scripts/install/install.sh
            scripts/install/install.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
