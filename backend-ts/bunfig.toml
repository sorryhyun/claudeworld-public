# `bun test` from this package. Preload pins the environment before any module
# can read it: src/config/env.ts resolves paths and freezes settings at import
# time, so a test that imports it before the preload ran would capture the
# developer's real .env instead of the fixture one.
[test]
preload = ["./src/tests/setup/env.ts"]
pathIgnorePatterns = ["**/dist/**", "**/node_modules/**"]

# Tailwind for the dev server's CSS. `make dev` runs with this directory as its
# cwd, which is how Bun finds this file; the repo-root bunfig.toml carries the
# same block for a run started from there. Both are needed -- see the note there.
[serve.static]
plugins = ["bun-plugin-tailwind"]

# `env` is the dev server's only substitution mechanism, and the reason
# `apiClient.ts` reads `process.env.VITE_API_BASE_URL` rather than
# `import.meta.env.*`. `Bun.serve` takes no `define` (bunfig ignores one here
# too -- tested), and it rewrites `import.meta` to an HMR shim whose `.env` is
# undefined, so the `import.meta` spelling threw a TypeError on the first line
# of apiClient.ts and rendered a white page in `make dev` while `bun run build`
# -- which does have a `define` -- was fine. Bun's default glob is
# `BUN_PUBLIC_*`; the name has to stay `VITE_`-prefixed because it is baked into
# the Vercel project's settings.
env = "VITE_*"
